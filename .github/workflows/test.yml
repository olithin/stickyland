name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit + Compose UI tests
        run: |
          # Windows-only java.home in gradle.properties breaks CI/mac.
          sed -i.bak 's/^org.gradle.java.home=/# org.gradle.java.home=/' gradle.properties || true
          chmod +x gradlew
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libxrender1 libxtst6 libxi6
          # Compose UI tests need a display (Playwright would need a browser; we use Compose test).
          xvfb-run -a ./gradlew test --no-daemon --stacktrace
